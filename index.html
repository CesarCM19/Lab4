<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Fixture SA - Layout Responsive</title>
    <link rel="stylesheet" href="styles.css" />
</head>
<body>

    SECCIÓN 1: LAYOUT GRIS (Fixture SA)
    <section class="seccion-gris">
    <h2 class="seccion-titulo">Layout Fixture SA (Responsivo)</h2>

    <div class="fixture-wrapper">
        <header class="fixture-header">Fixture SA</header>

    <main class="fixture-grid">
        <div class="fixture-celda celda-a">A</div>
        <div class="fixture-celda celda-b">B</div>
        <div class="fixture-celda celda-c">C</div>
        <div class="fixture-celda celda-d">D</div>
        <div class="fixture-celda celda-e">E</div>
    </main>
    </div>
</section>

    SECCIÓN 2: LAYOUT AZUL (Semántico HTML5)
    <section class="seccion-azul">
    <h2 class="seccion-titulo">Layout Semántico HTML5 (Responsivo)</h2>

    <div class="semantico-wrapper">
        <header class="sem-header">header</header>

    <div class="sem-body">
        <nav class="sem-nav">nav</nav>
        <article class="sem-article">article</article>
        <aside class="sem-aside">aside</aside>
    </div>

        <footer class="sem-footer">footer</footer>
    </div>
    </section>

</body>
</html>
